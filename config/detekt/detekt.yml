# VoxLog detekt configuration. Builds upon detekt's defaults; only deviations are listed.
# Thresholds here are quality gates: CI fails on any violation. See docs/testing.md.

comments:
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
  UndocumentedPublicProperty:
    active: false

complexity:
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 10
    ignoreSimpleWhenEntries: true
  LongMethod:
    active: true
    allowedLines: 60
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    allowedFunctionParameters: 6
    allowedConstructorParameters: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    allowedDepth: 4
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 15
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 15
    ignorePrivate: true
    ignoreOverridden: true

naming:
  BooleanPropertyNaming:
    active: true
    allowedPattern: '^(is|has|are|can|should|was|did)'
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
  # Screens keep their small Actions/UiState classes beside the composable; ktlint's filename rule
  # still enforces file naming for single-class files.
  MatchingDeclarationName:
    active: false

style:
  MaxLineLength:
    active: true
    maxLineLength: 140
  MagicNumber:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
  ForbiddenComment:
    active: true
  ReturnCount:
    active: true
    max: 2
    excludeGuardClauses: true
  UnusedImport:
    active: true

Compose:
  ModifierMissing:
    active: true
  ViewModelForwarding:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals: LocalClock
